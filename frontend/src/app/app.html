<nav class="public-navbar" *ngIf="showPublicNavbar()">
  <a class="public-brand" routerLink="/" aria-label="Centre Commercial">
    <span class="public-logo-wrap">
      <img class="public-logo" src="assets/logo.png" alt="Centre Commercial" />
    </span>
  </a>

  <div class="public-links" [class.mobile-open]="mobileMenuOpen()">
    <a class="public-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Accueil</a>
    <a class="public-link" routerLink="/client/products" routerLinkActive="active">Produits</a>
    <a class="public-link" routerLink="/about" routerLinkActive="active">À propos</a>
    <a class="public-link" routerLink="/contact" routerLinkActive="active">Contact</a>

    <div class="mobile-auth" *ngIf="!isClientLoggedIn()">
      <a class="public-btn secondary" routerLink="/register" (click)="toggleMobileMenu()">S'inscrire</a>
      <a class="public-btn" routerLink="/login" (click)="toggleMobileMenu()">Connexion</a>
    </div>
  </div>

  <div class="public-actions">
    <button class="mobile-menu-toggle" (click)="toggleMobileMenu()" *ngIf="!mobileMenuOpen()">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <button class="mobile-menu-toggle close" (click)="toggleMobileMenu()" *ngIf="mobileMenuOpen()">
      <span></span>
      <span></span>
    </button>
    <ng-container *ngIf="!isClientLoggedIn(); else loggedClient">
      <a class="public-btn secondary" routerLink="/register">S'inscrire</a>
      <a class="public-btn" routerLink="/login">Connexion</a>
    </ng-container>

    <ng-template #loggedClient>
      <div class="user-menu">
        <button type="button" class="user-trigger" (click)="toggleUserMenu()">
          {{ getClientName() }}
        </button>
        <div class="user-dropdown" *ngIf="userMenuOpen()">
          <a class="user-item" routerLink="/client/profile" (click)="toggleUserMenu()">👤 Profil</a>
          <a class="user-item" routerLink="/client/purchases" (click)="toggleUserMenu()">🧾 Historique</a>
          <button type="button" class="user-item" (click)="logout()">Déconnexion</button>
        </div>
      </div>
    </ng-template>
  </div>
</nav>

<div [class.public-container]="showPublicNavbar()" [class.full-container]="!showPublicNavbar()">
  <router-outlet />
</div>

<footer class="global-footer">
  <div class="global-footer__inner">
    ANDRIAMALALA TSIKINIONY BRADY ET RAVELONARIVO TSIORIMBOLA ANTONIO
  </div>
</footer>
