<div class="login-container">
  <h2>🔐 Login</h2>

  <div class="login-types">
    <div class="types-row top">
      <button type="button" class="type-btn" [class.active]="loginType === 'admin'" (click)="setLoginType('admin')">
        <span class="type-icon"></span>
        <span class="type-label">Admin</span>
      </button>
    </div>

    <div class="types-row bottom">
      <button type="button" class="type-btn" [class.active]="loginType === 'boutique'" (click)="setLoginType('boutique')">
        <span class="type-icon">🏪</span>
        <span class="type-label">Boutique</span>
      </button>
      <button type="button" class="type-btn" [class.active]="loginType === 'client'" (click)="setLoginType('client')">
        <span class="type-icon">👤</span>
        <span class="type-label">Client</span>
      </button>
    </div>
  </div>

  <div class="form" [class.animating]="animating">
    <div class="form-group">
      <input type="email" [(ngModel)]="email" placeholder="📧 Votre email">
    </div>

    <div class="form-group">
      <input type="password" [(ngModel)]="password" placeholder="🔒 Votre mot de passe">
    </div>

    <button (click)="onLogin()">Se connecter</button>
  </div>

  <div class="register-link">
    <a routerLink="/register">S'inscrire</a>
  </div>
</div>
