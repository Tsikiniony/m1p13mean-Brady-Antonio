<div class="layout">
  <nav class="navbar">
    <div class="brand">🏪 Boutique</div>

    <button type="button" class="hamburger" (click)="toggleMenu()" aria-label="Menu">
      ☰
    </button>

    <div class="navbar-menu" [class.open]="menuOpen">
      <div class="links">
        <a routerLink="/boutique/dashboard" routerLinkActive="active" class="nav-link">📊 Dashboard</a>
        <a routerLink="/boutique/boutiques" routerLinkActive="active" class="nav-link">Mes boutiques</a>
        <a routerLink="/boutique/demande-box" routerLinkActive="active" class="nav-link">Demander une box</a>
        <a routerLink="/boutique/sales" routerLinkActive="active" class="nav-link">Ventes</a>
        <a routerLink="/boutique/deliveries" routerLinkActive="active" class="nav-link">Livraisons</a>
      </div>
      <button type="button" class="logout-btn mobile-logout" (click)="logout()">Déconnexion</button>
    </div>

    <div class="user-menu desktop-logout">
      <button type="button" class="user-trigger" (click)="toggleUserMenu()">
        {{ getBoutiqueLabel() }}
      </button>
      <div class="user-dropdown" *ngIf="userMenuOpen">
        <a class="user-item" routerLink="/boutique/profile" (click)="toggleUserMenu()">👤 Profil</a>
        <a class="user-item" routerLink="/boutique/history" (click)="toggleUserMenu()">🧾 Mon historique</a>
        <a class="user-item" routerLink="/boutique/rents" (click)="toggleUserMenu()">🏷️ Mes loyers</a>
        <button type="button" class="user-item" (click)="logout()">Déconnexion</button>
      </div>
    </div>
  </nav>

  <div class="content">
    <router-outlet></router-outlet>
  </div>
</div>
